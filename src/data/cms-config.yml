# ===========================================================================
# Vigorix Prime — Sveltia CMS configuration
# ---------------------------------------------------------------------------
# Sveltia is a drop-in, Decap-compatible CMS. It reads this file at /admin/.
#
# BEFORE THIS WORKS YOU MUST (see deploy steps):
#   1. Push this project to a GitHub repo.
#   2. Replace the `repo` value below with the real GitHub owner/repo.
#   3. Deploy the OAuth worker (oauth-worker/) and put its URL in base_url.
# ===========================================================================

backend:
  name: github
  repo: nghia8m/vigorix_prime
  # The shop lives on this branch and has not been merged, so pointing the CMS
  # at main showed "Shop Products 0" — the config is read from this site, but
  # the CONTENT is read from GitHub, and main has no products in it.
  #
  # Editing here therefore commits to shop-phase-1, not to the branch the live
  # site is built from. Change this back to main at the same time the shop is
  # merged, or the CMS will keep writing to a branch nobody deploys.
  branch: shop-phase-1
  # Single sign-on: base_url is rewritten to this site own origin by
  # src/pages/admin/config.yml.ts, and auth_endpoint points at our endpoint
  # rather than at GitHub. Pressing "Sign In with GitHub" therefore reuses the
  # admin password session instead of asking for a GitHub account.
  base_url: SITE_ORIGIN_PLACEHOLDER
  auth_endpoint: api/admin/git-auth

# Where uploaded images are stored in the repo, and how they're referenced
# in the built site. Astro serves everything in /public at the site root.
media_folder: "public/images"
public_folder: "/images"

# Logo shown on the Sveltia CMS login screen.
logo_url: /favicon.png

collections:
  # -------------------------------------------------------------------------
  # ARTICLES — add / edit / delete reviews without touching code
  # -------------------------------------------------------------------------
  - name: "articles"
    label: "Articles (Reviews)"
    label_singular: "Article"
    folder: "src/content/articles"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    summary: "{{title}} — {{category}}"
    sortable_fields: ["order", "title", "category"]
    fields:
      - { name: "title", label: "Title (H1)", widget: "string" }
      - { name: "metaTitle", label: "Meta Title (SEO, <=70 chars)", widget: "string", pattern: ['^.{1,70}$', "Keep under 70 characters"] }
      - { name: "metaDescription", label: "Meta Description (SEO, <=165 chars)", widget: "text", pattern: ['^.{1,165}$', "Keep under 165 characters"] }
      - name: "category"
        label: "Category"
        widget: "select"
        options: ["Supplements", "Performance", "Vitality", "Grooming"]
      - name: "categoryLink"
        label: "Category Link"
        widget: "select"
        options: ["/supplements", "/performance", "/vitality", "/grooming"]
        default: "/supplements"
      - { name: "cardImage", label: "Card / Hero Image", widget: "image", required: false }
      - { name: "ogImage", label: "Social Share Image (optional)", widget: "image", required: false }
      - { name: "cardTitle", label: "Short Card Title (optional)", widget: "string", required: false }
      - { name: "cardSummary", label: "Card Summary (homepage/category card text)", widget: "text" }
      - { name: "publishedLabel", label: "Published Label", widget: "string", default: "Updated 2025" }
      - { name: "readTime", label: "Read Time", widget: "string", default: "8 min read" }
      - { name: "intro", label: "Intro Paragraph", widget: "text" }
      - { name: "priceNote", label: "Price Note (under table)", widget: "string", default: "*Approximate prices for reference only. Confirm the current price on the retailer's page before buying." }
      - { name: "order", label: "Order (lower = shown earlier)", widget: "number", value_type: "int", default: 99 }
      - { name: "draft", label: "Draft (hide from site)", widget: "boolean", default: false }
      - name: "quickPick"
        label: "Quick Pick (top recommendation box)"
        widget: "object"
        fields:
          - { name: "name", label: "Product Name (must match a product below)", widget: "string" }
          - { name: "reason", label: "Why it's the quick pick", widget: "text" }
      - name: "products"
        label: "Products (ranked)"
        label_singular: "Product"
        widget: "list"
        summary: "{{fields.award}}: {{fields.name}}"
        fields:
          - { name: "name", label: "Product Name", widget: "string" }
          - { name: "award", label: "Award (e.g. Best Overall)", widget: "string" }
          - { name: "affiliateUrl", label: "Affiliate Link (paste after approval; leave empty = inert button)", widget: "string", required: false, default: "" }
          - { name: "price", label: "Price (display, e.g. ~$40)", widget: "string", default: "Check latest" }
          - { name: "rating", label: "Rating (display, e.g. 4.8 / 5)", widget: "string", required: false, default: "" }
          - { name: "bestFor", label: "Best For (table cell)", widget: "string", required: false, default: "" }
          - { name: "image", label: "Product Image (optional)", widget: "image", required: false }
          - { name: "description", label: "Description", widget: "text" }
          - { name: "pros", label: "Pros", widget: "list", field: { name: "item", label: "Pro", widget: "string" } }
          - { name: "cons", label: "Cons", widget: "list", field: { name: "item", label: "Con", widget: "string" } }
          - { name: "priceValue", label: "Price Value for SEO (number only, e.g. 40)", widget: "string", required: false, default: "" }
          - { name: "ratingValue", label: "Rating Value for SEO (e.g. 4.8)", widget: "string", required: false, default: "" }
          - { name: "ratingCount", label: "Rating Count for SEO (e.g. 212)", widget: "string", required: false, default: "" }
          - { name: "reviewBody", label: "Review Summary for SEO (1-2 sentences)", widget: "text", required: false, default: "" }
      - name: "faqs"
        label: "FAQs"
        widget: "list"
        required: false
        summary: "{{fields.q}}"
        fields:
          - { name: "q", label: "Question", widget: "string" }
          - { name: "a", label: "Answer", widget: "text" }
      - { name: "conclusion", label: "Conclusion", widget: "text" }

  # -------------------------------------------------------------------------
  # SHOP PRODUCTS — the Health Care range we sell ourselves
  # -------------------------------------------------------------------------
  # Same storage mechanism as Articles (files in the repo, committed by the CMS)
  # — there is no second, parallel product database anywhere.
  # Frontmatter = the structured fields below. Body = the long description.
  #
  # IMPORTANT: a product with "Draft" ON deliberately BLOCKS the production
  # build. Fill in the real copy, photos, prices and specs, then switch Draft off.
  - name: "products"
    label: "Shop Products"
    label_singular: "Product"
    folder: "src/content/products"
    create: true
    delete: true
    extension: "mdx"
    format: "frontmatter"
    slug: "{{fields.slug}}"
    # The list is the screen this collection is managed from, so it carries the
    # photo, the one-line description and the group — enough to pick the right
    # product without opening three of them to find out which is which.
    thumbnail: "images.0"
    summary: "{{fields.name}} — {{fields.subtitle}}"
    sortable_fields: ["order", "name", "price", "category"]
    view_groups:
      - label: "Group"
        field: category
    view_filters:
      - label: "Sample data (Draft ON — blocks the build)"
        field: draft
        pattern: true
      - label: "Real data (Draft OFF — will publish)"
        field: draft
        pattern: false
    fields:
      - { name: "name", label: "Product Name (H1)", widget: "string" }
      - { name: "subtitle", label: "One-line description", widget: "string", required: false, default: "", hint: "Shown on the homepage and /shop cards, and under the name on the product page. Say what the thing is, not how good it is." }
      # Meta Title and Meta Description were removed from this form. Search copy
      # is written on the review articles; a product page derives its title from
      # the name and its snippet from the one-line description above.
      # Picked from the groups declared in Site settings -> Shop groups, never
      # typed: a typo here would not error, it would quietly create a group of
      # one and put a stray block on the homepage.
      - name: "category"
        label: "Group"
        widget: "relation"
        collection: "settings"
        file: "site"
        search_fields: ["shop.groups.*.label", "shop.groups.*.id"]
        display_fields: ["shop.groups.*.label"]
        value_field: "shop.groups.*.id"
        default: "health-care"
        hint: "Which block this product appears in, on the homepage and on /shop. Add or rename groups under Site settings -> Shop groups."
      - { name: "categoryLabel", label: "Fallback group heading", widget: "string", default: "Health Care", hint: "Not normally shown — the heading comes from Site settings. This is only used if the group above is deleted, so the product still appears under a sensible name instead of a raw id." }
      - { name: "price", label: "Price (number only, e.g. 29)", widget: "number", value_type: "float" }
      - { name: "compareAt", label: "Was-price / struck-through (leave empty for none)", widget: "number", value_type: "float", required: false }
      - { name: "currency", label: "Currency code", widget: "string", default: "USD" }
      - { name: "sku", label: "Base SKU", widget: "string", required: false, default: "" }
      - name: "badges"
        label: "Badges (short labels shown next to the name)"
        widget: "list"
        required: false
        allow_reorder: true
        field: { name: "badge", label: "Badge", widget: "string" }
      # Variant type / question / list were removed from this form. One product
      # sells at one price and the buyer sets the amount with the quantity
      # stepper, so a size or pack picker had nothing to choose between.
      #
      # The FEATURE is still in the code and in the schema: a product carrying
      # variant data still renders a picker, prices each variant and tracks its
      # stock. Only the way to enter that data is gone. Put these three fields
      # back and everything works again — nothing else has to change.
      # A product page cannot ship without at least one image, so the rule is
      # enforced here (blocks Save) as well as in the Zod schema (blocks build).
      # ONE field, many photos. `multiple: true` on the image widget opens the
      # file picker with multi-select, so five or seven photographs go up in a
      # single pass and are stored as a plain list of paths.
      #
      # Width, height and alt text used to be typed in beside every photo. They
      # are not asked for any more: the build reads the real pixel size out of
      # the file (src/lib/image-size.ts) and writes the alt text from the
      # product name, which cannot be typed in wrong.
      #
      # Uploads land in public/images/shop/ rather than the site-wide
      # public/images/ folder.
      - name: "images"
        label: "Photos — pick several at once; the first one is the main image"
        widget: "image"
        multiple: true
        required: true
        media_folder: "/public/images/shop"
        public_folder: "/images/shop"
        hint: "Select 5–7 photos in one go (hold Ctrl or Shift in the file picker). Drag to reorder — the first is the main photo, the social share image and the thumbnail in this list. Any shape is fine; the page crops to a portrait frame. Keep each file under 400 KB."
      - name: "video"
        label: "Video (optional)"
        widget: "object"
        required: false
        fields:
          - { name: "url", label: "Video file URL", widget: "string" }
          - { name: "poster", label: "Poster image", widget: "image", required: false, default: "" }
      # The Specifications table is gone. The left-hand column of a product page
      # is two blocks now — photos, then one description — so a separate table of
      # label/value pairs had nowhere to render and only made this form longer.
      # Anything that belonged in it goes in the description, where the author
      # can lay it out as a real table (see the description hint below).
      - name: "trust"
        label: "Trust boxes (up to 4 shown)"
        widget: "list"
        required: false
        allow_reorder: true
        summary: "{{fields.title}}"
        fields:
          - { name: "icon", label: "Icon", widget: "select", options: ["shield", "truck", "refresh", "support", "leaf", "lock"], default: "shield" }
          - { name: "title", label: "Title", widget: "string" }
          - { name: "sub", label: "Sub-text", widget: "string", required: false, default: "" }
      # "Ships to" was removed. It printed one decorative line in the buy panel
      # and nothing else — it never restricted an address, never priced a
      # country and never stopped an order — and it was left empty on every
      # product. Where a product really does ship belongs in a Trust box or in
      # the description, next to the claim it supports.
      - { name: "stock", label: "Stock", widget: "select", options: ["in", "out", "preorder"], default: "in", hint: "Out of stock disables the buy button and the checkout refuses the line, so it cannot be bought by an old link either." }
      # Buy link, Quantity query parameter and Variant query parameter were
      # removed. All three existed to hand the shopper over to somebody else's
      # checkout page — the shop takes the payment itself now, so every one of
      # them was left empty on every product and only made this form longer.
      - name: "relatedArticles"
        label: "Related review guides (article filename without .md) — links both ways, outside the rankings"
        widget: "list"
        required: false
        allow_reorder: true
        field: { name: "id", label: "Article id", widget: "string" }
      - { name: "order", label: "Order (lower = shown earlier)", widget: "number", value_type: "int", default: 99 }
      # Moved down here out of the way. It cannot be deleted: this is the page
      # address AND the key the checkout uses to look up a price on the server,
      # so a product without one cannot be bought. Set it once when the product
      # is created, then never touch it again.
      - { name: "slug", label: "URL slug — set once, then leave alone (page will be /shop/<slug>)", widget: "string", hint: "Changing this changes the page URL, breaks existing links, and orphans anything already in a customer's cart.", pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "Lowercase letters, numbers and hyphens only"] }
      # HONEST LABEL. This used to promise it blocked the production build. It
      # does not: Cloudflare builds with `npm run build:preview`, which sets
      # ALLOW_DRAFT_PRODUCTS=1 and turns the guard into a log line nobody reads.
      # `npm run build` on a developer's machine still blocks. Until the two
      # flags are separated, a product left ON here ships live and sellable.
      - { name: "draft", label: "Draft — work in progress", widget: "boolean", default: true, hint: "A note to yourself that this product is not finished. WARNING: it does NOT hide the product from the live site — a product left ON here still gets a page and can still be bought. Switch it OFF once every field holds real data: no TODO left, real photos, real price." }
      # The description block. Every formatting button the editor has is turned
      # on, and the "raw" mode is added beside the rich-text one.
      #
      # Raw mode is not a developer escape hatch here, it is the only route to
      # two things the toolbar has no button for: TEXT COLOUR and TABLES. Both
      # are written as ordinary HTML in raw mode and render as-is on the page.
      # Ready-made snippets to paste are in the hint below.
      - name: "body"
        label: "Description — the one long block under the photos"
        widget: "markdown"
        modes: ["rich_text", "raw"]
        buttons:
          - bold
          - italic
          - strikethrough
          - code
          - link
          - heading-two
          - heading-three
          - heading-four
          - bulleted-list
          - numbered-list
          - quote
        editor_components: ["image", "code-block"]
        hint: >-
          Write it like a document: headings, bold, lists, quotes and photos from the toolbar.
          For COLOURED TEXT or a TABLE, switch the editor to "raw" and paste HTML —
          colour: <span style="color:#c25100">text in orange</span> ·
          table: <table><thead><tr><th>Item</th><th>Detail</th></tr></thead><tbody><tr><td>Size</td><td>250 ml</td></tr></tbody></table>.
          Tables get borders and scroll sideways on a phone automatically.
          Avoid treatment claims (cure / treat / heal / relief) and never publish a made-up figure.

  # -------------------------------------------------------------------------
  # SITE SETTINGS — header, footer, and site-wide verification/analytics code
  # -------------------------------------------------------------------------
  - name: "settings"
    label: "Site Settings"
    delete: false
    editor:
      preview: false
    files:
      - name: "site"
        label: "Header, Footer & Code"
        file: "src/data/site.json"
        fields:
          # -------------------------------------------------------------------
          # SHIPPING FIRST, and open. Everything below it starts collapsed.
          #
          # Shipping used to sit past eight menu items and eighteen footer
          # links: about sixty inputs of scrolling to reach a setting changed
          # far more often than a footer link. The order is how often a thing
          # is edited, not how neatly it groups.
          #
          # Shop groups is set up once and then left alone, so it sits with
          # the collapsed blocks rather than above postage.
          # -------------------------------------------------------------------
          # -----------------------------------------------------------------
          # SHIPPING — one charge per pack, and that is the whole model.
          #
          # There is no rate list, no free-shipping threshold and no "we have
          # not decided" state: the switch is either ON (charge per pack) or
          # OFF (free, and the cart says Free). Money is in CENTS.
          #
          # The pack size comes from Ordering rules above — a pack is what gets
          # boxed, so it is what gets posted. Change the pack there and postage
          # follows automatically.
          # -----------------------------------------------------------------
          - name: "shipping"
            label: "Shipping"
            widget: "object"
            fields:
              - name: "enabled"
                label: "Charge for shipping"
                widget: "boolean"
                default: false
                hint: "OFF = free shipping, and the cart shows the word Free. ON = each pack is charged the amount below. There is no third setting — turning this off IS the free-shipping campaign."
              - name: "perBlockCents"
                label: "Price per pack (CENTS)"
                widget: "number"
                value_type: "int"
                min: 0
                default: 2500
                hint: "In cents: 2500 = $25.00. Whole numbers only — do not type 25.00. Charged once per pack, so with packs of 3 an order of 6 items pays this twice."
              - { name: "currency", label: "Currency code", widget: "string", default: "USD" }
          # -----------------------------------------------------------------
          # ORDERING RULES — enforced by the server, not only by the cart, so a
          # request sent straight to the API cannot skip them.
          # -----------------------------------------------------------------
          - name: "ordering"
            label: "Ordering rules"
            widget: "object"
            fields:
              - name: "minQtyPerProduct"
                label: "Minimum quantity per product (pack size)"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                default: 4
                hint: "Applies to EACH product separately. With 4, a shopper must take 4 of one product; one each of four different products does NOT count. Set to 1 to sell singles and hide every mention of packs from shoppers."
          - { name: "logoPre", label: "Logo — first part", widget: "string" }
          - { name: "logoAccent", label: "Logo — accent part", widget: "string" }
          - name: "header"
            label: "Header Navigation"
            widget: "object"
            collapsed: true
            fields:
              - name: "nav"
                label: "Menu Items"
                widget: "list"
                summary: "{{fields.label}}"
                fields:
                  - { name: "label", label: "Label", widget: "string" }
                  - { name: "href", label: "Link", widget: "string" }
          - name: "footer"
            label: "Footer"
            widget: "object"
            collapsed: true
            fields:
              - { name: "tagline", label: "Tagline", widget: "text" }
              - name: "columns"
                label: "Footer Columns"
                widget: "list"
                summary: "{{fields.heading}}"
                fields:
                  - { name: "heading", label: "Column Heading", widget: "string" }
                  - name: "links"
                    label: "Links"
                    widget: "list"
                    summary: "{{fields.label}}"
                    fields:
                      - { name: "label", label: "Label", widget: "string" }
                      - { name: "href", label: "Link", widget: "string" }
              - { name: "disclosure", label: "Disclosure Line", widget: "text" }
              - { name: "copyright", label: "Copyright Line", widget: "string" }
          - name: "hero"
            label: "Homepage Hero Banner (slideshow)"
            widget: "object"
            collapsed: true
            fields:
              - name: "slides"
                label: "Banner Slides (auto-rotate; leave empty for plain navy hero)"
                widget: "list"
                required: false
                summary: "{{fields.image}}"
                fields:
                  - { name: "image", label: "Image (JPG/PNG/GIF/animated WebP — 1920x1080)", widget: "image" }
                  - { name: "alt", label: "Alt text (optional)", widget: "string", required: false, default: "" }
          - name: "deals"
            label: "Deals Card (homepage)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "image", label: "Image", widget: "image", required: false }
              - { name: "title", label: "Title", widget: "string" }
              - { name: "text", label: "Description", widget: "text" }
              - { name: "link", label: "Link (URL or #anchor)", widget: "string" }
          # -----------------------------------------------------------------
          # SHOP GROUPS — the groups products are sorted into. Each group gets
          # its own strip on the homepage and its own block on /shop, in the
          # order listed here. "Group ID" is what each product stores, so
          # changing an ID orphans every product still pointing at the old one:
          # they keep selling and stay listed under their own heading, but they
          # stop belonging to this group until they are re-assigned.
          # -----------------------------------------------------------------
          - name: "shop"
            label: "Shop groups"
            widget: "object"
            collapsed: true
            fields:
              - name: "homeLimit"
                label: "Products per group on the homepage"
                widget: "number"
                value_type: "int"
                min: 1
                max: 12
                default: 3
                hint: "The homepage shows a taste of each group; the link beside the heading sends shoppers to /shop for the rest. /shop always shows everything."
              - name: "groups"
                label: "Groups"
                widget: "list"
                min: 1
                hint: "One block per group, in this order. Drag to reorder."
                summary: "{{fields.label}}  ({{fields.id}})"
                fields:
                  - name: "id"
                    label: "Group ID (do not change once products use it)"
                    widget: "string"
                    pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "Lowercase letters, numbers and hyphens only"]
                    hint: "The value each product stores. Set it once and leave it alone — renaming it detaches the products already in this group."
                  - name: "label"
                    label: "Heading shown to shoppers"
                    widget: "string"
                    hint: "Safe to change any time. This is the heading above the block."
                  - name: "note"
                    label: "Sentence under the heading"
                    widget: "text"
                    required: false
                    default: ""
                    hint: "Must not claim the products are reviewed, scored or ranked — they are ours, so they are excluded from all editorial rankings. The disclosure link is added automatically."
          - name: "code"
            label: "Site-wide Code"
            widget: "object"
            collapsed: true
            required: false
            fields:
              # Plain textarea (text) widgets — reliable to save. Paste raw HTML
              # (GA4 / Awin / Impact snippets); it is injected verbatim via set:html.
              - name: "customHead"
                label: "Custom Head Code (GA4 / Awin / Impact verification, analytics)"
                widget: "text"
                required: false
                default: ""
              - name: "customBody"
                label: "Custom Body Code (end of <body>)"
                widget: "text"
                required: false
                default: ""
          - name: "contact"
            label: "Contact Form"
            widget: "object"
            collapsed: true
            fields:
              - { name: "web3formsKey", label: "Web3Forms Access Key (paste the key from web3forms.com)", widget: "string", required: false }
