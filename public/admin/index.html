<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Vigorix Prime — Admin</title>
  </head>
  <body>
    <!-- Sveltia CMS (drop-in, Decap-compatible). Reads /admin/config.yml.
         Loaded as a classic script (NOT type=module) per Sveltia's guidance. -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>

    <!-- =====================================================================
         Shop Products — save-time validation
         ---------------------------------------------------------------------
         config.yml already blocks the rules it can express on its own:
           • images[] empty        -> required: true + min: 1
           • an image missing alt  -> required: true on the alt subfield
         The rules below need to compare items against EACH OTHER, or look at a
         file on disk, which the config language cannot do. They run on save so
         the editor finds out here, not three minutes later in a failed build.

           preSave  BLOCKS : duplicate variant id, duplicate variant SKU,
                             a variant pointing at an image index that is not there
           preSave  WARNS  : no buy link set (allowed in phase 1)
           postSave WARNS  : image over 400 KB

         Why the size check runs AFTER the save: an image picked in the editor is
         only written to disk when the entry is saved, so at preSave time a HEAD
         request for a freshly added image 404s and the check would silently pass
         — exactly when it matters most. At postSave the file is on disk, so the
         measurement is real. The warning still arrives long before a build or a
         deploy, which is what it is for.

         Kept as plain ES5-ish script on purpose: no build step, no bundler, and
         it still works when the CMS is loaded from the CDN.
         ===================================================================== -->
    <script>
      (function () {
        var MAX_IMAGE_BYTES = 400 * 1024;

        function toPlain(value) {
          if (value && typeof value.toJS === "function") return value.toJS();
          return value;
        }

        /** Synchronous HEAD request; returns byte size, or null when unknown. */
        function fileSize(url) {
          try {
            var xhr = new XMLHttpRequest();
            xhr.open("HEAD", url, false); // sync: preSave handlers run synchronously
            xhr.send(null);
            if (xhr.status < 200 || xhr.status >= 300) return null;
            var len = xhr.getResponseHeader("Content-Length");
            return len ? parseInt(len, 10) : null;
          } catch (e) {
            return null;
          }
        }

        function duplicates(values) {
          var seen = {}, dupes = [];
          values.forEach(function (v) {
            if (!v) return;
            var k = String(v).trim().toLowerCase();
            if (!k) return;
            if (seen[k]) { if (dupes.indexOf(v) === -1) dupes.push(v); }
            seen[k] = true;
          });
          return dupes;
        }

        /** Size check, run after the save so the files actually exist on disk. */
        function oversizedImages(data) {
          var warnings = [], unknown = 0;
          (data.images || []).forEach(function (img, i) {
            if (!img || !img.url) return;
            var bytes = fileSize(img.url);
            if (bytes === null) { unknown++; return; }
            if (bytes > MAX_IMAGE_BYTES)
              warnings.push("Image " + (i + 1) + " (" + img.url + ") is " +
                            Math.round(bytes / 1024) + " KB — over the 400 KB guideline. " +
                            "Re-export it smaller before this product goes live.");
          });
          if (unknown)
            warnings.push(unknown + " image(s) could not be measured (not readable at " +
                          "their public URL yet). Re-open and save the product to check them.");
          return warnings;
        }

        /** Site Settings → Shipping. One charge per pack, so there is one figure
         *  to check. Money here is in cents: a negative or fractional value is a
         *  data error, not a preference. */
        function validateShipping(data) {
          var errors = [], warnings = [];
          var s = data.shipping;
          if (!s || typeof s !== "object") return { errors: errors, warnings: warnings };

          var per = s.perBlockCents;

          if (typeof per === "number") {
            if (per < 0)
              errors.push('"Price per pack" cannot be negative (got ' + per + ").");
            if (!Number.isInteger(per))
              errors.push('"Price per pack" is in CENTS, so it must be a whole number (got ' + per +
                          "). 2500 means $25.00.");
          }

          // Switching postage ON with nothing to charge is almost always a typo
          // for a figure the owner meant to enter — but free shipping is a real
          // choice, so this warns rather than blocks.
          if (s.enabled === true && (!per || per === 0))
            warnings.push("Shipping is ON but the price per pack is 0, so every order still ships free. " +
                          "Enter an amount in cents, or switch shipping back OFF.");

          // A price that looks like dollars rather than cents. $0.25 postage is
          // not a real policy; 25 almost certainly meant 2500.
          if (s.enabled === true && typeof per === "number" && per > 0 && per < 100)
            warnings.push("Price per pack is " + per + " cents ($" + (per / 100).toFixed(2) +
                          "). This field is in CENTS — did you mean " + per * 100 + "?");

          return { errors: errors, warnings: warnings };
        }

        function validateProduct(data) {
          var errors = [], warnings = [];
          var variants = data.variants || [];
          var images = data.images || [];

          var dupIds = duplicates(variants.map(function (v) { return v && v.id; }));
          if (dupIds.length)
            errors.push('Variant id used more than once: ' + dupIds.join(", ") +
                        ". Every variant needs its own id.");

          var dupSkus = duplicates(variants.map(function (v) { return v && v.sku; }));
          if (dupSkus.length)
            errors.push('Variant SKU used more than once: ' + dupSkus.join(", ") +
                        ". Two variants cannot share a SKU.");

          // Variant imageIndex must point at an image that exists.
          variants.forEach(function (v, i) {
            var idx = v && v.imageIndex;
            if (typeof idx === "number" && images.length && (idx < 0 || idx >= images.length))
              errors.push("Variant " + (v.label || i + 1) + ' points at image ' + idx +
                          ", but this product only has " + images.length + " image(s).");
          });

          if (!data.purchaseUrl) {
            var variantHasUrl = variants.some(function (v) { return v && v.purchaseUrl; });
            if (!variantHasUrl)
              warnings.push("No buy link is set, so the buy button will ship disabled. " +
                            "That is allowed in phase 1 — just be aware the product cannot be bought yet.");
          }

          return { errors: errors, warnings: warnings };
        }

        function register() {
          if (!window.CMS || !window.CMS.registerEventListener) return false;

          window.CMS.registerEventListener({
            name: "preSave",
            handler: function (payload) {
              var entry = payload && payload.entry;
              var data = toPlain(entry && entry.get ? entry.get("data") : entry && entry.data) || {};

              // Site Settings carries a "shipping" block; products do not.
              var isSettings = "shipping" in data && "footer" in data;
              // Only the Shop Products collection carries these two keys together.
              var isProduct = "purchaseUrl" in data && "images" in data;
              if (!isSettings && !isProduct) return;

              var result = isSettings ? validateShipping(data) : validateProduct(data);
              // Exposed so the headless test can read what the handler decided.
              window.__vpValidation = result;

              if (result.errors.length) {
                var message = (isSettings ? "Cannot save these settings:" : "Cannot save this product:") +
                  "\n\n• " + result.errors.join("\n• ");
                // Throwing is what actually blocks the save, and the CMS reports
                // a thrown handler with its own generic "there was an error"
                // box. So this reason is followed by a second, vaguer dialog
                // about the same problem — say so, or it reads as two faults.
                window.alert(message + "\n\nNothing has been saved. The CMS will now show its own " +
                  "generic error about this same problem — the reason is the one above.");
                throw new Error(message);
              }
              if (result.warnings.length) {
                window.alert("Saved with warnings:\n\n• " + result.warnings.join("\n• "));
              }
            },
          });

          // Image weight is measured here, not in preSave — see the note above.
          window.CMS.registerEventListener({
            name: "postSave",
            handler: function (payload) {
              var entry = payload && payload.entry;
              var data = toPlain(entry && entry.get ? entry.get("data") : entry && entry.data) || {};
              if (!("purchaseUrl" in data) || !("images" in data)) return;

              var warnings = oversizedImages(data);
              window.__vpImageCheck = warnings;
              if (warnings.length) window.alert("Image check:\n\n• " + warnings.join("\n• "));
            },
          });

          // Exposed for the automated checks, which exercise the rules directly
          // rather than driving the whole editor UI.
          window.__vpValidateShipping = validateShipping;
          window.__vpValidateProduct = validateProduct;

          window.__vpValidationReady = true;
          return true;
        }

        if (!register()) {
          // The CDN script may still be initialising; retry briefly.
          var tries = 0;
          var timer = setInterval(function () {
            if (register() || ++tries > 100) clearInterval(timer);
          }, 100);
        }
      })();
    </script>
    <!-- The CMS is a separate app and cannot host the admin tab bar, so this
         puts one link back. Same session, no second sign-in. -->
    <a id="vp-back-to-admin" href="/admin/orders">&larr; Orders</a>
    <style>
      #vp-back-to-admin {
        position: fixed; left: 12px; bottom: 12px; z-index: 2147483000;
        background: #0c6f9e; color: #fff; font: 600 13px/1 system-ui, sans-serif;
        padding: 9px 14px; border-radius: 20px; text-decoration: none;
        box-shadow: 0 4px 14px rgba(0,0,0,0.28);
      }
      #vp-back-to-admin:hover { background: #084f73; }
    </style>
  </body>
</html>
