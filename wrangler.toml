name = "vigorix-prime"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# ---------------------------------------------------------------------------
# Plain variables live HERE, not in the dashboard. Once a project has a
# wrangler.toml, Cloudflare manages non-secret variables from this file and the
# dashboard only accepts Secrets — anything typed there as "Text" is silently
# dropped, which is exactly what happened to these three.
#
# Secrets stay in the dashboard on purpose: this repository is public, so a
# PayPal secret or an admin password hash written here would be readable by
# anyone, permanently, including in git history after deletion.
#
# ALLOW_DRAFT_PRODUCTS is needed at RUNTIME as well as at build time. The pages
# are prerendered with the drafts included, but /api/paypal/capture-order
# re-reads the catalogue when the order is placed — without the flag there it
# filtered the drafts back out and refused every order with "unknown_product",
# after the shopper had filled in the whole form.
#
# REMOVE THIS BLOCK when the products are real: the guard comes back, and the
# shop stops depending on a flag to sell anything.
# ---------------------------------------------------------------------------
[vars]
# No products carry draft any more, so this changes nothing — kept only so the
# flag is visible rather than forgotten. Delete it when convenient.
ALLOW_DRAFT_PRODUCTS = "1"

# LIVE. Real cards, real money, real refunds.
#
# Two things follow automatically from this word:
#   - api-m.paypal.com replaces api-m.sandbox.paypal.com, so the CLIENT_ID and
#     SECRET secrets must be the LIVE app's. Sandbox keys against live endpoints
#     fail authentication and every order is refused.
#   - webhook signature verification becomes mandatory and the local bypass flag
#     is ignored outright, whatever it is set to.
PAYPAL_MODE = "live"

# ---------------------------------------------------------------------------
# Orders database.
#
# LOCAL ONLY for now: `wrangler d1` keeps this database in .wrangler/state, and
# `astro dev` reaches it through the adapter's platformProxy. No Cloudflare
# account and no remote database are involved, and none is created by anything
# in this repo.
#
# When it is time to go live, create the real database once with
#   npx wrangler d1 create vigorix_orders
# and paste the returned database_id over the placeholder below. The migrations
# in migrations/ are the same either way.
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "ORDERS_DB"
database_name = "vigorix_orders"
database_id = "fb190ea2-8161-4876-802d-e4034996b85a"
migrations_dir = "migrations"

# PayPal credentials are NOT here. They live in .env locally and in Cloudflare
# environment variables in production; putting a secret in this file would put
# it in git history permanently.
